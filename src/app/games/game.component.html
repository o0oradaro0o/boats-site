<app-page-banner text="Game Details"></app-page-banner>

<ng-container *ngIf="!loading; else globalLoading">
  <div class="ocean-section-mid game-header-section">
    <div class="container">
      <game-detail [DetailGamesList]="generalData"></game-detail>
    </div>
  </div>

  <div class="ocean-section py-5">
    <div class="container">
      <game-player-snapshot
        [DetailGamesList]="playerData"
      ></game-player-snapshot>

      <div class="section-divider"></div>

      <div class="chart-section">
        <h3 class="section-label">Empire Gold History</h3>
        <game-gold-chart [DetailGamesList]="generalData"></game-gold-chart>
      </div>

      <div class="section-divider"></div>

      <div class="purchase-section">
        <h3 class="section-label">Purchase Log</h3>
        <app-purchase-log [playerDetails]="playerData"></app-purchase-log>
      </div>
    </div>
  </div>
</ng-container>

<ng-template #globalLoading>
  <div class="ocean-section py-5">
    <div
      class="container d-flex flex-column align-items-center py-5"
      style="gap: 1rem"
    >
      <mat-spinner diameter="40"></mat-spinner>
      <span class="loading-label">Loading game...</span>
    </div>
  </div>
</ng-template>
