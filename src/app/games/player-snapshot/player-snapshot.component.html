<div class="teams-grid">
  <div class="team-section" *ngIf="northTeamData && northTeamData.length > 0">
    <div class="team-header team-header--north">
      <span class="team-badge">North Empire</span>
      <span class="team-count">{{ northTeamData.length }} players</span>
    </div>
    <app-end-game-table [playerData]="northTeamData"></app-end-game-table>
  </div>

  <div class="team-section" *ngIf="southTeamData && southTeamData.length > 0">
    <div class="team-header team-header--south">
      <span class="team-badge">South Empire</span>
      <span class="team-count">{{ southTeamData.length }} players</span>
    </div>
    <app-end-game-table [playerData]="southTeamData"></app-end-game-table>
  </div>
</div>
