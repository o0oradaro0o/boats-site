<ng-container *ngFor="let group of tierGroups">
  <div class="tier-section">
    <div class="tier-section__header">
      <div class="tier-section__title-group">
        <span class="tier-section__label">{{ group.label }}</span>
        <span *ngIf="group.sublabel" class="tier-section__sublabel">{{
          group.sublabel
        }}</span>
      </div>
      <span class="tier-section__count">{{ group.ships.length }} ships</span>
    </div>
    <div class="ship-grid">
      <app-ship-card
        *ngFor="let entry of group.ships; let i = index"
        [shipData]="entry.shipData"
        [boatRecord]="entry.record"
        [totalSample]="TotalSample"
        [animationDelay]="i * 60"
      ></app-ship-card>
    </div>
  </div>
</ng-container>
