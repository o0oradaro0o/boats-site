<nav class="site-nav">
  <div class="site-nav__inner container">
    <a class="site-nav__brand" routerLink="/">
      <i class="fas fa-ship"></i>
      <span class="site-nav__brand-text">BATTLESHIPS</span>
    </a>

    <button
      class="site-nav__toggle"
      (click)="menuOpen = !menuOpen"
      aria-label="Toggle navigation"
    >
      <i class="fas fa-anchor"></i>
    </button>

    <ul class="site-nav__links" [class.site-nav__links--open]="menuOpen">
      <li routerLinkActive="active">
        <a routerLink="/games" (click)="menuOpen = false">Games</a>
      </li>
      <li routerLinkActive="active">
        <a routerLink="/players" (click)="menuOpen = false">Players</a>
      </li>
      <li routerLinkActive="active">
        <a routerLink="/boats" (click)="menuOpen = false">Boats</a>
      </li>
      <li routerLinkActive="active">
        <a routerLink="/items" (click)="menuOpen = false">Items</a>
      </li>
    </ul>
  </div>
  <div class="site-nav__wave" aria-hidden="true"></div>
</nav>
