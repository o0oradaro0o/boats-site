<app-page-banner text="Item Stats"></app-page-banner>

<div class="ocean-section py-5">
  <div class="container">
    <ng-container *ngIf="ItemRecordList$ | async as data; else loading">
      <items-list [ItemRecordList]="data"></items-list>
    </ng-container>
    <ng-template #loading>
      <div class="text-center py-5">
        <mat-spinner class="mx-auto"></mat-spinner>
      </div>
    </ng-template>
  </div>
</div>
