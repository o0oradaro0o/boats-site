<app-page-banner text="Player Details"></app-page-banner>

<div class="ocean-section py-4">
  <div class="container">
    <div class="player-tabs">
      <button
        class="player-tab"
        [class.player-tab--active]="activeTab === 'boats'"
        (click)="activeTab = 'boats'"
      >
        <i class="fas fa-ship"></i> Boats
      </button>
      <button
        class="player-tab"
        [class.player-tab--active]="activeTab === 'items'"
        (click)="activeTab = 'items'"
      >
        <i class="fas fa-wrench"></i> Items
      </button>
    </div>

    <div class="player-tab-panel" [hidden]="activeTab !== 'boats'">
      <player-boats-list
        [ItemRecordList]="BoatRecordList$ | async"
      ></player-boats-list>
    </div>
    <div class="player-tab-panel" [hidden]="activeTab !== 'items'">
      <player-items-list
        [ItemRecordList]="ItemRecordList$ | async"
      ></player-items-list>
    </div>

    <section class="mt-4">
      <h3 class="player-section__heading">Recent Games</h3>
      <app-player-recent-games-list
        [recentGames]="recentGames"
      ></app-player-recent-games-list>
    </section>
  </div>
</div>
